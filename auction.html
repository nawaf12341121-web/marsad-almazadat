<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#062653">
<meta name="robots" content="index,follow,max-image-preview:large">
<title>تفاصيل المزاد | مرصد المزادات</title>
<meta name="description" content="اطّلع على تفاصيل المزاد ومواعيده وموقعه والجهة المنظمة، وانتقل إلى المصدر الأصلي عبر مرصد المزادات.">
<meta property="og:type" content="article">
<meta property="og:locale" content="ar_SA">
<meta property="og:site_name" content="مرصد المزادات">
<meta property="og:title" content="تفاصيل المزاد | مرصد المزادات">
<meta property="og:description" content="تفاصيل المزاد ومواعيده ومعلومات الجهة المنظمة ورابط المصدر الأصلي.">
<style>
:root{--navy:#062653;--navy2:#0b3269;--gold:#f2b51b;--bg:#f4f6fb;--ink:#10264a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif}
header{background:#fff;padding:12px 5%;box-shadow:0 2px 14px #10264a0c}
header a{color:var(--navy);text-decoration:none;font-weight:bold;font-size:21px;display:inline-flex;align-items:center;gap:10px}
.brand-mark{width:42px;height:42px;display:grid;place-items:center;flex:0 0 auto;color:#c58a1c;border:1px solid #d9a63b;border-radius:13px;background:linear-gradient(145deg,#fff,#f7f2e7)}
.brand-mark svg{width:33px;height:33px;display:block}
main{max-width:900px;margin:32px auto;padding:0 16px}
.back{display:inline-block;margin-bottom:18px;color:var(--navy);text-decoration:none;font-weight:bold}
.card{background:#fff;border:1px solid #e2e7f0;border-radius:18px;overflow:hidden;box-shadow:0 5px 22px #10264a0c}
.cover{width:100%;max-height:430px;object-fit:cover;display:block;background:#e9edf7}
.cover-placeholder{min-height:230px;background:linear-gradient(135deg,#062653,#174477);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;text-align:center}.cover-placeholder .symbol{font-size:0;width:68px;height:68px;border:1px solid #f2b51b99;border-radius:20px;position:relative;background:#ffffff0b}.cover-placeholder .symbol:before{content:"";position:absolute;inset:12px;border:2px solid #f2b51b;border-radius:50%}.cover-placeholder .symbol:after{content:"";position:absolute;width:24px;height:10px;left:21px;top:28px;border-top:2px solid #f2b51b;border-bottom:2px solid #f2b51b;transform:skewY(-20deg)}.cover-placeholder strong{font-size:24px}.cover-placeholder small{font-size:14px;color:#d5dfef}
.content{padding:25px}
h1{color:var(--navy);font-size:30px;line-height:1.6;margin:0 0 14px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.tag{background:#e9edf7;color:var(--navy);border-radius:30px;padding:7px 12px;font-size:13px;font-weight:bold}
.status{background:#e7f6ed;color:#177245}
.description{white-space:pre-line;line-height:2;color:#53627a;font-size:15px;margin:20px 0}
.details{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:20px 0}
.detail{background:#f7f8fb;border:1px solid #e8ebf2;border-radius:12px;padding:13px}
.detail small{display:block;color:#78849a;margin-bottom:6px}
.detail strong{color:var(--navy);line-height:1.7}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.button{display:inline-block;text-decoration:none;text-align:center;background:var(--navy);color:#fff;border-radius:30px;padding:13px 20px;font-weight:bold}
.button.secondary{background:#e9edf7;color:var(--navy)}
.message{background:#fff;border-radius:15px;padding:30px;text-align:center;line-height:2;color:#53627a}
footer{text-align:center;color:#7b8799;padding:25px;font-size:12px}
@media(max-width:600px){main{margin:18px auto}.content{padding:18px}h1{font-size:23px}.details{grid-template-columns:1fr}}

/* Match the Wasalt-inspired listing interface */
:root{--navy:#173b67;--navy2:#244f7d;--gold:#d7a23b;--bg:#f7f8fa;--ink:#26384d}
body{background:#f7f8fa;color:#26384d}
header{background:#fff;border-bottom:1px solid #edf0f4;box-shadow:0 2px 12px #142c4810}
header a{color:#173b67}
.brand-mark{color:#c9942e;background:#fbf8f1;border-color:#e9d7b2}
main{max-width:1000px;margin:25px auto}
.back{color:#315578;font-size:13px}
.card{border:1px solid #e8ebef;border-radius:10px;box-shadow:0 2px 12px #1d35500a}
.content{padding:25px}
h1{color:#243e5c;font-size:27px}
.tag{background:#f1f4f7;color:#52647a;border-radius:5px}
.status{background:#e7f5ed;color:#23804d}
.description{color:#65758a}
.detail{background:#f7f8fa;border:1px solid #e9edf1;border-radius:8px}
.detail small{color:#8792a1}
.detail strong{color:#304966}
.button{background:#244f7d;border-radius:7px}
.button.secondary{background:#f1f4f7;color:#315578}
footer{color:#8792a1}

</style>
</head>
<body>
<header><a href="./"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 48 48" role="presentation"><circle cx="24" cy="24" r="20" fill="none" stroke="currentColor" stroke-width="2.5"/><circle cx="24" cy="24" r="12.5" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".65"/><path d="M15 29V19l9 7 9-7v10" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24" cy="13" r="2.2" fill="currentColor"/></svg></span><span>مرصد المزادات</span></a></header>
<main>
<a class="back" id="backToAuctions" href="./">← العودة إلى جميع المزادات</a>
<div id="result" class="message">جارٍ تحميل تفاصيل المزاد...</div>
</main>
<footer>© <span id="year"></span> مرصد المزادات</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
document.getElementById("year").textContent = new Date().getFullYear();
const SUPABASE_URL = "https://qvstihtqqtgpcrsqruml.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_P5kd7PluEy92nWdYb3PbCg_1a8-ZOm5";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
const result = document.getElementById("result");
const returnPage = Math.max(1, Number(new URLSearchParams(location.search).get("page")) || 1);
document.getElementById("backToAuctions").href = "./?page=" + returnPage + "#auctions";
document.querySelector("header a").href = "./";
function esc(value){return String(value ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function safeURL(value){try{const u=new URL(value);return ["https:","http:"].includes(u.protocol)?u.href:null;}catch{return null;}}
function date(value){if(!value)return "غير محدد";const d=new Date(value);if(Number.isNaN(d.getTime()))return "غير محدد";return new Intl.DateTimeFormat("ar-SA",{year:"numeric",month:"long",day:"numeric"}).format(d);}
function statusLabel(value,start,end){
 if(value==="cancelled") return "ملغي";
 if(value==="postponed") return "مؤجل";
 if(value==="ended") return "منتهي";
 const now=new Date();
 const endDate=end?new Date(end):null;
 const startDate=start?new Date(start):null;
 if(endDate && !Number.isNaN(endDate.getTime()) && endDate<now) return "منتهي";
 if(startDate && !Number.isNaN(startDate.getTime()) && startDate>now) return "قادم";
 if(startDate && !Number.isNaN(startDate.getTime()) && startDate<=now && (!endDate || Number.isNaN(endDate.getTime()) || endDate>=now)) return "يجري الآن";
 if(!startDate && value==="active") return "يجري الآن";
 return "قادم";
}
async function load(){
 const id = new URLSearchParams(location.search).get("id");
 if(!id || !/^\d+$/.test(id)){result.textContent="رابط المزاد غير صحيح.";return;}
 const {data,error}=await db.from("auctions").select("id,title,category,source_name,source_url,auction_url,location,description,image_url,start_date,end_date,status").eq("id",id).in("status",["published","ended"]).maybeSingle();
 if(error){console.error(error);result.textContent="تعذر تحميل تفاصيل المزاد. حاول مرة أخرى لاحقاً.";return;}
 if(!data){result.textContent="المزاد غير موجود أو لم يعد منشوراً.";return;}
 const image=safeURL(data.image_url);
 const auctionLink=safeURL(data.auction_url);
 const sourceLink=safeURL(data.source_url);
 document.title = (data.title || "تفاصيل المزاد") + " | مرصد المزادات";
 const pageDescription = (data.description || "تفاصيل المزاد ومواعيده ومعلومات الجهة المنظمة عبر مرصد المزادات.").replace(/\s+/g," ").slice(0,155);
 const descriptionTag = document.querySelector('meta[name="description"]');
 if(descriptionTag) descriptionTag.setAttribute("content", pageDescription);
 const canonicalUrl = location.origin + location.pathname + "?id=" + encodeURIComponent(id);
 let canonicalTag = document.querySelector('link[rel="canonical"]');
 if(!canonicalTag){canonicalTag=document.createElement("link");canonicalTag.rel="canonical";document.head.appendChild(canonicalTag);}
 canonicalTag.href = canonicalUrl;
 let ogUrl = document.querySelector('meta[property="og:url"]');
 if(!ogUrl){ogUrl=document.createElement("meta");ogUrl.setAttribute("property","og:url");document.head.appendChild(ogUrl);}
 ogUrl.setAttribute("content", canonicalUrl);
 const ogTitle = document.querySelector('meta[property="og:title"]');
 if(ogTitle) ogTitle.setAttribute("content", document.title);
 const ogDescription = document.querySelector('meta[property="og:description"]');
 if(ogDescription) ogDescription.setAttribute("content", pageDescription);
 if(image){
   let ogImage = document.querySelector('meta[property="og:image"]');
   if(!ogImage){ogImage=document.createElement("meta");ogImage.setAttribute("property","og:image");document.head.appendChild(ogImage);}
   ogImage.setAttribute("content", image);
 }
 result.className="card";
 result.innerHTML=`
 ${image?`<img class="cover" src="${esc(image)}" alt="${esc(data.title)}" loading="lazy">`:`<div class="cover-placeholder" role="img" aria-label="صورة المزاد غير متاحة"><span class="symbol" aria-hidden="true"></span><strong>مرصد المزادات</strong><small>الصورة غير متاحة حالياً</small></div>`}
 <div class="content">
 <div class="tags"><span class="tag">${esc(data.category||"غير مصنف")}</span><span class="tag">${esc(data.location||"الموقع غير محدد")}</span><span class="tag status">${esc(statusLabel(data.status,data.start_date,data.end_date))}</span></div>
 <h1>${esc(data.title)}</h1>
 <div class="details">
 <div class="detail"><small>الجهة المنظمة</small><strong>${esc(data.source_name||"غير محدد")}</strong></div>
 <div class="detail"><small>موقع المزاد</small><strong>${esc(data.location||"غير محدد")}</strong></div>
 <div class="detail"><small>تاريخ البداية</small><strong>${esc(date(data.start_date))}</strong></div>
 <div class="detail"><small>تاريخ النهاية</small><strong>${esc(date(data.end_date))}</strong></div>
 </div>
 <h3>وصف المزاد</h3>
 <div class="description">${esc(data.description||"لا يوجد وصف إضافي لهذا المزاد.")}</div>
 <div class="actions">
 ${auctionLink?`<a class="button" href="${esc(auctionLink)}" target="_blank" rel="noopener noreferrer">الانتقال إلى صفحة المزاد ↗</a>`:""}
 ${sourceLink?`<a class="button secondary" href="${esc(sourceLink)}" target="_blank" rel="noopener noreferrer">زيارة موقع الجهة المنظمة ↗</a>`:""}
 </div>
 </div>`;
}
load();
</script>
</body>
</html>
