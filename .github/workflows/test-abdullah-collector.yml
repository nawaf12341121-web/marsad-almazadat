name: Test Abdullah Fouad preview collector

on:
  push:
    paths:
      - "collector/**"
      - ".github/workflows/test-abdullah-collector.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r collector/requirements.txt

      - name: Run preview collector
        working-directory: collector
        run: python preview_abdullah_fouad.py --delay 1.5 --max-pages 20

      - name: Upload preview report
        uses: actions/upload-artifact@v4
        with:
          name: abdullah-fouad-preview
          path: collector/abdullah_fouad_preview.json
          if-no-files-found: error
          retention-days: 7
